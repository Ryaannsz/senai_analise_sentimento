<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Como você está?</title>
  <meta name="description" content="Escreva o que está sentindo e veja a cor mudar conforme o modelo do SENAI lê o seu texto.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ceu" aria-hidden="true">
    <span class="nuvem nuvem-a"></span>
    <span class="nuvem nuvem-b"></span>
    <span class="nuvem nuvem-c"></span>
  </div>

  <div class="pagina">
    <header class="marca">
      <span class="marca-nome">SENAI</span>
      <span class="marca-produto">Análise de sentimento</span>
    </header>

    <main>
      <h1 id="pergunta" class="pergunta">Como você está se sentindo agora?</h1>

      <textarea
        id="texto"
        name="texto"
        class="campo"
        rows="3"
        maxlength="1000"
        aria-labelledby="pergunta"
        aria-describedby="dica erro"
        placeholder="Escreva com suas palavras, do jeito que vier."
        autofocus
      ></textarea>

      <div class="linha-apoio">
        <p id="dica" class="dica">A cor muda enquanto você escreve.</p>
        <button id="limpar" type="button" class="botao-texto" hidden>Limpar</button>
      </div>

      <p id="erro" class="erro" role="alert" hidden></p>

      <section id="resultado" class="resultado" hidden>
        <p class="resultado-frase">Seu texto soa</p>
        <p id="sentimento" class="sentimento" aria-live="polite"></p>

        <div class="escala">
          <div class="escala-faixa" aria-hidden="true">
            <span id="marcador" class="escala-marcador"></span>
          </div>
          <div class="escala-pontas" aria-hidden="true">
            <span>negativo</span>
            <span>positivo</span>
          </div>
          <p id="chance" class="chance"></p>
        </div>
      </section>
    </main>

    <footer class="rodape">
      O modelo foi treinado com comentários de clientes e pode errar com frases sobre outros assuntos.
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
