[project]
name = "senai-analise-sentimento"
version = "0.1.0"
description = "API de análise de sentimento do SENAI"
readme = "README.md"
authors = [
    { name = "ryan", email = "ryancarvalho.ber@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.4",
    "joblib>=1.6.0",
    "loguru>=0.7.3",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]

[tool.fastapi]
entrypoint = "senai_analise_sentimento.main:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
